name: Compilar version portable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx
          --name Babel
          --icon icono.ico
          --add-data "icono.ico;."
          --add-data "icono.png;."
          --version-file version_info.txt
          --collect-all customtkinter
          Babel.py

      - name: Empaquetar ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Babel -DestinationPath Babel_portable.zip

      - name: Calcular SHA-256
        shell: pwsh
        run: (Get-FileHash Babel_portable.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Babel_portable
          path: |
            Babel_portable.zip
            SHA256.txt

      - name: Publicar en Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Babel_portable.zip
            SHA256.txt
